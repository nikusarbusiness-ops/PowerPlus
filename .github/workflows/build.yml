name: Build CorePlus

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ordnerstruktur anlegen
        run: |
          mkdir -p src/main/java/de/coreplus src/main/resources
          mv CorePlus.java src/main/java/de/coreplus/
          mv plugin.yml config.yml src/main/resources/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Plugin bauen
        run: mvn -B clean package

      - name: Release mit JAR erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" target/CorePlus-*.jar \
            --title "CorePlus Build ${{ github.run_number }}" \
            --notes "Automatischer Build aus Commit ${{ github.sha }}"
